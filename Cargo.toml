[package]
name = "excali-desktop"
version = "0.1.0"
edition = "2024"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.3", features = [] }

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "rustls"] }
tauri = { version = "=3.0.0-alpha.4", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.5"
tauri-plugin-dialog = { version = "=3.0.0-alpha.3", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "=3.0.0-alpha.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
